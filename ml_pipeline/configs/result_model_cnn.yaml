# Configuration for Football Result Prediction Model - CNN Version

model:
  name: "result_model_cnn"
  type: "classification"
  algorithm: "cnn"
  
  # CNN-specific hyperparameters
  hyperparameters:
    input_shape: [16, 16, 1]
    num_conv_layers: 3
    filters: [32, 64, 128]
    kernel_size: 3
    dense_layers: [256, 128]
    dropout_rate: 0.3
    optimizer: "adam"
    batch_size: 32
    epochs: 50
    learning_rate: 0.001
    early_stopping_patience: 10

# Data configuration
data:
  feature_loader: "load_result_features"
  target_column: "result"  # home_win, away_win, draw
  match_id_column: "match_id"
  
  # Tables to use for features
  feature_tables:
    - "elo_history"
    - "fatigue_history"
    - "stage_of_season_history"
    - "formation_history"
    - "match_info_history"
  
  # Filters
  filters:
    min_date: "2020-01-01"
    max_date: null
    leagues: null  # null means all leagues
    
  # Train/test split
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  stratify: true

# Preprocessing configuration
preprocessing:
  scale_features: true
  handle_missing: true
  drop_missing_threshold: 0.5
  
  # Feature engineering
  feature_engineering:
    create_elo_differences: true
    create_form_features: true
    create_interaction_features: false
    
    # CNN-specific preprocessing
    reshape_for_cnn: true
    cnn_input_format: "grid"  # Options: "grid", "time_series", "feature_map"
    normalize_input: true
    data_augmentation: false

# Training configuration
training:
  cross_validation:
    enabled: true
    folds: 5
    scoring: "accuracy"
  
  early_stopping:
    enabled: true
    patience: 10
    metric: "accuracy"
    restore_best_weights: true
  
  class_weights: "balanced"
  
  # CNN-specific training settings
  cnn_training:
    use_gpu: true
    gpu_memory_fraction: 0.8
    checkpoint_dir: "ml_pipeline/checkpoints"
    tensorboard_dir: "ml_pipeline/logs/tensorboard"
    save_best_only: true
    monitor: "val_accuracy"
    mode: "max"

# Evaluation configuration
evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
  
  # Additional evaluation settings
  confusion_matrix: true
  feature_importance: true
  learning_curves: true
  
  # CNN-specific evaluation
  cnn_evaluation:
    plot_training_history: true
    plot_confusion_matrix: true
    plot_feature_maps: true
    save_predictions: true

# Output configuration
output:
  save_model: true
  save_predictions: true
  save_feature_importance: true
  save_evaluation_report: true
  
  # Paths
  model_dir: "ml_pipeline/saved_models"
  predictions_dir: "data/predictions"
  reports_dir: "ml_pipeline/reports"
  
  # CNN-specific output
  cnn_output:
    save_model_format: "h5"  # or "saved_model"
    save_weights: true
    save_architecture: true
    save_training_history: true

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "ml_pipeline/logs/result_model_cnn.log"
  
  # CNN-specific logging
  tensorboard:
    enabled: true
    update_freq: "epoch"
    profile_batch: 0
    histogram_freq: 1 