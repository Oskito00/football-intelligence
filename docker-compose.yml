services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn football_intelligence.api:app --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    environment: &football_intelligence_env
      DB_HOST: host.docker.internal
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY}

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api

  prediction-refresh:
    profiles:
      - operations
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m football_intelligence.cli prediction-refresh
    environment: *football_intelligence_env

  model-training:
    profiles:
      - operations
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m football_intelligence.cli model-training
    environment: *football_intelligence_env
