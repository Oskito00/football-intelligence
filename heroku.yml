setup:
  addons:
    - plan: heroku-postgresql:essential-2

build:
  docker:
    web: Dockerfile.web
    prediction-refresh: Dockerfile.operations
    model-training: Dockerfile.operations

release:
  command:
    - echo 'Release phase'
  image: web

run:
  web: python -m uvicorn football_intelligence.api:app --host 0.0.0.0 --port $PORT
  prediction-refresh: python -m football_intelligence.cli prediction-refresh
  model-training: python -m football_intelligence.cli model-training
