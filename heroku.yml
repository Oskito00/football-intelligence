setup:
  addons:
    - plan: heroku-postgresql:essential-2

build:
  docker:
    web: frontend/Dockerfile
    api:
      dockerfile: chatbot/Dockerfile
      context: .
    scheduler:
      dockerfile: scheduler/Dockerfile
      context: .

release:
  command:
    - echo 'Release phase'
  image: api

run:
  web: npm start
  api: uvicorn chatbot.api:app --host 0.0.0.0 --port $PORT  
  scheduler: python -m scheduler.scheduler
