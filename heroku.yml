setup:
  addons:
    - plan: heroku-postgresql:essential-2

build:
  docker:
    web: chatbot/Dockerfile
    scheduler: scheduler/Dockerfile

release:
  command:
    - echo 'Release phase'
  image: web

run:
  web: bash -c "cd /app && PYTHONPATH=/app python -m uvicorn chatbot.api:app --host 0.0.0.0 --port $PORT"
  scheduler: bash -c "cd /app && PYTHONPATH=/app python -m scheduler.scheduler"
