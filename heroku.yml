setup:
  addons:
    - plan: heroku-postgresql:essential-2

build:
  docker:
    web: 
      dockerfile: chatbot/Dockerfile
      context: .
    scheduler:
      dockerfile: scheduler/Dockerfile
      context: .

release:
  command:
    - echo 'Release phase'
  image: web

run:
  web: python -m uvicorn chatbot.api:app --host 0.0.0.0 --port $PORT
  scheduler: python -m scheduler.scheduler
