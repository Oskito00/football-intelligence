setup:
  addons:
    - plan: heroku-postgresql:essential-2

build:
  docker:
    web: chatbot/Dockerfile
    scheduler: scheduler/Dockerfile

release:
  command:
    - echo 'Release phase'
  image: web

run:
  web: uvicorn chatbot.api:app --host 0.0.0.0 --port $PORT
  scheduler: python -m scheduler.scheduler
