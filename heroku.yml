setup:
  addons:
    - plan: heroku-postgresql:essential-2

build:
  docker:
    web: Dockerfile.web
    scheduler: Dockerfile.scheduler

release:
  command:
    - echo 'Release phase'
  image: web

run:
  web: python -m uvicorn chatbot.api:app --host 0.0.0.0 --port $PORT
  scheduler: python -m scheduler.scheduler
