services:
  frontend:
    build: 
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api

  api:
    build: 
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=host.docker.internal
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

  prediction-refresh:
    profiles:
      - operations
    build:
      context: .
      dockerfile: Dockerfile.operations
    command: python -m football_intelligence.cli prediction-refresh
    environment:
      - DB_HOST=host.docker.internal
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}

  model-training:
    profiles:
      - operations
    build:
      context: .
      dockerfile: Dockerfile.operations
    command: python -m football_intelligence.cli model-training
    environment:
      - DB_HOST=host.docker.internal
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}
