services:
  frontend:
    build: 
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://165.227.225.47:5000
    depends_on:
      - api

  api:
    build: 
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=localhost
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

  prediction-refresh:
    profiles:
      - operations
    build:
      context: .
      dockerfile: Dockerfile.operations
    command: python -m football_intelligence.cli prediction-refresh
    environment:
      - DB_HOST=localhost
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}

  model-training:
    profiles:
      - operations
    build:
      context: .
      dockerfile: Dockerfile.operations
    command: python -m football_intelligence.cli model-training
    environment:
      - DB_HOST=localhost
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY}

build:
  docker:
    web: frontend/Dockerfile
    api: Dockerfile.web
    prediction-refresh: Dockerfile.operations
    model-training: Dockerfile.operations
