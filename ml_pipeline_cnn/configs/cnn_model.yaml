model:
  name: cnn_football_predictor
  architecture:
    # Form sequence processing (10 matches, 2 features each)
    form_conv_layers:
      - filters: 32
        kernel_size: 3
        stride: 1
      - filters: 64
        kernel_size: 2
        stride: 1
    form_pool_size: 2
    
    # H2H sequence processing (10 matches, 2 features each)
    h2h_conv_layers:
      - filters: 16
        kernel_size: 3
        stride: 1
      - filters: 32
        kernel_size: 2
        stride: 1
    h2h_pool_size: 2
    
    traditional_features_size: 118  # 96 ELO features + 2 other features
    
    # Fully connected layers - increased sizes to handle more features
    fc_layers:
      - units: 256  # Increased from 128
        dropout: 0.3
      - units: 128  # Increased from 64
        dropout: 0.2
    
    # Output layer (3 classes: home win, draw, away win)
    output_units: 3

