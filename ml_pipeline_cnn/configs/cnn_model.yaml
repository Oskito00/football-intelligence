training:
  epochs: 100
  learning_rate: 0.01
  batch_size: 32
  early_stopping:
    patience: 10
    min_delta: 0.001
  optimizer: adam
  loss: cross_entropy
  metrics:
    - accuracy
    - f1_score
  lr_scheduler:
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 3
    min_lr: 0.0001
  
  # Data filters
  filters:
    min_date: '2010-01-01'
    max_date: '2023-12-31'
    leagues: [1, 2, 3, 4]  # Example league IDs 